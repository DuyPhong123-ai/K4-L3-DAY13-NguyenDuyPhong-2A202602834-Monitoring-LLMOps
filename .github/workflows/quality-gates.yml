name: quality-gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Validate dashboard contract
        run: python scripts/validate_dashboard.py
      - name: Scan secrets, PII, and forbidden artifacts
        run: python scripts/security_scan.py
      - name: Enforce cost optimization regression gate
        run: python scripts/cost_benchmark.py --min-saving-pct 20
